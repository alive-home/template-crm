# Alive deploy contract for this template.
#
# Read by alive-home/alive's @webalive/site-runtime-docker at deploy
# time (via the alive_toml_snapshot column on deploy.project_releases).
# Documents which target is the public service, what port each
# service listens on inside the cluster, and which env vars MUST be
# set at deploy time.
#
# This file is the contract between the project and the hoster:
#   - Renaming a service here is a breaking change for routing.
#   - Adding a new env_required key without setting a value blocks
#     the next deploy until the user sets it.
#   - public_target receives ALL external traffic; non-public services
#     are reachable only intra-cluster via container DNS (`http://api:3001`,
#     etc.).

schema = 1

[deploy]
# The bake target that receives external traffic. Must match a key in
# `[deploy.services]` AND a target name in docker-bake.hcl.
public_target = "web"

# ─── Services ────────────────────────────────────────────────────────────────
# Each declared service maps 1:1 to a docker-bake.hcl target. The runtime
# pulls one image per service (by digest) and wires them on a single
# bridge network where service names are DNS labels.

[deploy.services.api]
# Port the api process listens on inside its container. Used to bind
# the intra-cluster DNS endpoint (http://api:3001) — never exposed
# publicly because `api` is not the public_target.
port = 3001
# The CRM's database and its one password. Required for every deploy:
# without the Turso pair every /api/crm request fails, and without
# CRM_PASSWORD a production api serves nothing.
env_required = ["TURSO_DATABASE_URL_CRM", "TURSO_API_KEY_CRM", "CRM_PASSWORD"]

[deploy.services.web]
# Container port the nginx in apps/web listens on (see apps/web/Dockerfile
# `EXPOSE 80`). The runtime publishes this on the host so the routing
# layer can reverse-proxy to it.
port = 80
# web depends on api so the api container is started first. nerdctl
# only enforces ordering, not health — but starting api first means
# the /rpc proxy in nginx.conf has its upstream resolvable on first
# request.
depends_on = ["api"]

# ─── Dev (alive-workspaced) ─────────────────────────────────────────────────
# Reference: https://app.alive.site/schemas/alive-toml
# The [deploy] tables above are read by the deployer, not by the in-sandbox
# daemon, which reports them as unknown-table warnings; that is expected.

[project]
root = "."

[setup]
# Idempotent: install deps, and create a gitignored .env with a generated
# AUTH_SECRET (the login password) only if one does not exist yet.
command = "bun install && { [ -f .env ] || sed \"s|^AUTH_SECRET=.*|AUTH_SECRET=$(openssl rand -base64 32)|\" .env.example > .env; }"
timeout_seconds = 600
# bun's isolated linker puts a node_modules in every workspace package.
keep = [
  "node_modules",
  "apps/api/node_modules",
  "apps/web/node_modules",
  "packages/shared/node_modules",
  "packages/ui/node_modules",
  "e2e/node_modules",
]

[setup.produces]
env_file = ".env"
root_modules = "node_modules"

[dev.services.web]
kind = "frontend"
port = 3000
# Vite; /rpc is proxied to the api service (see apps/web/vite.config.ts).
# Deliberately no .env: its VITE_API_BASE_URL=http://localhost:3001 would make
# the browser bypass the proxy; unset means same-origin "/rpc".
command = "cd apps/web && bunx vite --port 3000 --strictPort"
needs = ["api"]

[dev.services.api]
kind = "backend"
port = 3001
health_path = "/health"
# .env.development holds the env keys set in Alive's settings; it is read after
# .env so those win. Bun skips a missing file.
command = "cd apps/api && WEB_BASE_URL=https://3000-$ALIVE_PREVIEW_HOST_SUFFIX API_BASE_URL=https://3000-$ALIVE_PREVIEW_HOST_SUFFIX bun --env-file=../../.env --env-file=../../.env.development --hot run src/index.ts"
